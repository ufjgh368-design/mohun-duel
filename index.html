<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c14">
<title>墨魂對決 — 臺灣藝術家知識格鬥 RPG</title>
<meta name="description" content="臺灣藝術家知識格鬥 RPG:以答題為武器的回合制戰鬥,認識陳澄波、黃土水、郭雪湖等 12 位臺灣美術先驅。">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" as="image" href="assets/hero-bg.jpg">
</head>
<body>

<!-- 全域背景粒子 -->
<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>
<div class="fog fog-a"></div>
<div class="fog fog-b"></div>

<!-- ═══════════ 首頁 ═══════════ -->
<section id="screen-home" class="screen active">
  <div class="hero">
    <div class="hero-art"></div>
    <div class="player-bar hidden" id="player-bar"></div>
    <div class="hero-center">
      <div class="logo-seal">藝</div>
      <h1 class="logo-title">墨魂對決</h1>
      <p class="logo-sub">臺灣藝術家 · 知識格鬥 RPG</p>
      <div class="logo-divider"><span>◆</span></div>
      <p class="hero-tag">以知識為刃 · 以藝術為魂 · 三十先驅 山河再會</p>
      <div class="hero-actions">
        <div class="login-actions" id="login-actions">
          <button class="btn btn-gold btn-xl btn-google" id="btn-google">
            <svg class="g-mark" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span id="btn-google-text">用 Google 帳號登入</span>
          </button>
          <button class="btn btn-ghost btn-xl" id="btn-offline">離線進入對決戰場</button>
        </div>
        <p class="login-note" id="login-note"></p>
        <div class="hero-subactions">
          <button class="btn btn-ghost" id="btn-gallery-home">角色圖鑑</button>
          <button class="btn btn-ghost" id="btn-leaderboard">排行榜</button>
          <button class="btn btn-ghost" id="btn-settings">設定</button>
        </div>
        <div class="sister-links">
          <span class="sister-label">◆ 系列作品 ◆</span>
          <div class="sister-row">
            <a class="btn btn-ghost btn-sister" href="art-combat/index.html">🖼️ 西洋藝術大亂鬥</a>
            <a class="btn btn-ghost btn-sister" href="art-adventure/index.html">🗺️ 藝術尋寶大冒險</a>
            <a class="btn btn-ghost btn-sister" href="adhd-adventure/index.html">🧠 我的 ADHD 大腦冒險</a>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-footer">
      <button class="icon-btn" id="btn-bgm" title="背景音樂">♪</button>
      <span class="hero-credit">思影藝術工作室：何至剛製作</span>
      <button class="icon-btn" id="btn-sfx" title="音效">🔊</button>
    </div>
  </div>
</section>

<!-- ═══════════ 模式選擇 ═══════════ -->
<section id="screen-modes" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-home">‹ 返回</button>
    <h2 class="screen-title">選擇模式</h2>
    <div class="header-spacer" id="modes-user"></div>
  </header>
  <div id="mode-grid" class="mode-grid"></div>
</section>

<!-- ═══════════ 角色選擇 ═══════════ -->
<section id="screen-select" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-modes">‹ 返回</button>
    <h2 class="screen-title" id="select-title">選擇角色</h2>
    <div class="header-spacer"></div>
  </header>
  <p class="select-hint" id="select-hint"></p>
  <div id="char-grid" class="char-grid"></div>
  <div id="char-detail" class="char-detail hidden"></div>
  <div class="select-footer">
    <div id="pick-status" class="pick-status"></div>
    <div class="difficulty-row hidden" id="ai-difficulty-row">
      <span class="diff-label">AI 難度</span>
      <div class="diff-btns" id="diff-btns"></div>
    </div>
    <button class="btn btn-gold btn-lg hidden" id="btn-battle-start">進入戰鬥</button>
  </div>
</section>

<!-- ═══════════ 戰鬥畫面 ═══════════ -->
<section id="screen-battle" class="screen">
  <div class="battle-stage" id="battle-stage">
    <div class="stage-bg"></div>
    <div class="stage-ground"></div>

    <div class="battle-hud">
      <div class="fighter-panel left" id="panel-p1">
        <div class="fp-name-row"><span class="fp-name" id="name-p1"></span><span class="fp-tag" id="tag-p1"></span></div>
        <div class="bar hp-bar"><div class="bar-fill" id="hp-p1"></div><span class="bar-text" id="hptext-p1"></span></div>
        <div class="bar en-bar"><div class="bar-fill" id="en-p1"></div><span class="bar-label">氣</span></div>
        <div class="fp-combo" id="combo-p1"></div>
      </div>
      <div class="battle-center">
        <div class="round-label" id="round-label">ROUND 1</div>
        <div class="timer-ring" id="timer-ring"><span id="timer-text">–</span></div>
      </div>
      <div class="fighter-panel right" id="panel-p2">
        <div class="fp-name-row"><span class="fp-tag" id="tag-p2"></span><span class="fp-name" id="name-p2"></span></div>
        <div class="bar hp-bar rtl"><div class="bar-fill" id="hp-p2"></div><span class="bar-text" id="hptext-p2"></span></div>
        <div class="bar en-bar rtl"><div class="bar-fill" id="en-p2"></div><span class="bar-label">氣</span></div>
        <div class="fp-combo" id="combo-p2"></div>
      </div>
    </div>

    <div class="arena">
      <div class="fighter fighter-left" id="fighter-p1"></div>
      <div class="vs-mark">對</div>
      <div class="fighter fighter-right" id="fighter-p2"></div>
    </div>

    <div class="battle-bottom" id="battle-bottom"></div>

    <div class="fx-layer" id="fx-layer"></div>
    <div class="announce" id="announce"></div>
    <div class="ultra-overlay" id="ultra-overlay"></div>
    <button class="btn btn-ghost btn-flee" id="btn-flee">離開戰鬥</button>
  </div>
</section>

<!-- ═══════════ 練習模式 ═══════════ -->
<section id="screen-practice" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-modes">‹ 返回</button>
    <h2 class="screen-title">練習模式</h2>
    <div class="header-spacer" id="practice-score"></div>
  </header>
  <div class="practice-wrap" id="practice-wrap"></div>
</section>

<!-- ═══════════ 教師模式 ═══════════ -->
<section id="screen-teacher" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-modes">‹ 返回</button>
    <h2 class="screen-title">教師模式 · 題庫管理</h2>
    <div class="header-spacer"></div>
  </header>
  <div class="teacher-wrap" id="teacher-wrap"></div>
</section>

<!-- ═══════════ 闖關模式 ═══════════ -->
<section id="screen-campaign" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-modes">‹ 返回</button>
    <h2 class="screen-title">美術史行旅</h2>
    <div class="header-spacer" id="campaign-progress"></div>
  </header>
  <div class="campaign-wrap" id="campaign-wrap"></div>
</section>

<!-- ═══════════ 卡牌模式:收藏與牌組 ═══════════ -->
<section id="screen-cards" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-modes">‹ 返回</button>
    <h2 class="screen-title">作品卡牌</h2>
    <div class="header-spacer" id="cards-progress"></div>
  </header>
  <div class="cards-wrap" id="cards-wrap"></div>
</section>

<!-- ═══════════ 卡牌對決 ═══════════ -->
<section id="screen-cardbattle" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" id="cb-quit">‹ 放棄對局</button>
    <h2 class="screen-title">卡牌對決</h2>
    <div class="header-spacer"></div>
  </header>
  <div class="cb-arena" id="cb-arena"></div>
</section>

<!-- ═══════════ 圖鑑 ═══════════ -->
<section id="screen-gallery" class="screen">
  <header class="screen-header">
    <button class="btn btn-back" data-back="screen-home">‹ 返回</button>
    <h2 class="screen-title">藝術家圖鑑</h2>
    <div class="header-spacer" id="gallery-progress"></div>
  </header>
  <div class="gallery-wrap" id="gallery-wrap"></div>
</section>

<!-- ═══════════ 勝負結算 ═══════════ -->
<div class="modal-backdrop hidden" id="result-modal">
  <div class="result-card" id="result-card"></div>
</div>

<!-- ═══════════ 通用 Modal ═══════════ -->
<div class="modal-backdrop hidden" id="modal">
  <div class="modal-card" id="modal-card"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/firebase-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
